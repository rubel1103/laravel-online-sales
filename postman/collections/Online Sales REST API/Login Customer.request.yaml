$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"customer@example.com\",\r

    \  \"password\": \"password123\",\r

    \  \"device_name\": \"Postman Praktikum\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.collectionVariables.set('customer_token', json.access_token);"
    language: text/javascript
order: 2000
